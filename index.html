<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Żużel na Trenażer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #1a1a1a;
            color: #fff;
            overflow: hidden;
            touch-action: none; /* Zapobiega scrollowaniu na mobilkach */
        }
        
        #game-canvas {
            background-color: #3f2a14; /* Ciemny brąz ziemi/żużlu */
            display: block;
            margin: 0 auto;
            border: 4px solid #555;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .retro-btn {
            background-color: #d97706;
            color: white;
            border: 4px solid #f59e0b;
            padding: 10px 20px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: transform 0.1s;
        }
        
        .retro-btn:active {
            transform: scale(0.95);
            background-color: #b45309;
        }

        .retro-input {
            background-color: #000;
            color: #10b981;
            border: 4px solid #555;
            padding: 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            width: 100%;
            outline: none;
        }

        /* Scanlines dla efektu CRT */
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfiguracja środowiska (dostarczana przez środowisko, lub fallback)
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
  apiKey: "AIzaSyASSqM1cn4pO1SF3wpDfv-53tdiYkLVi7E",
  authDomain: "zuzel-trenazery.firebaseapp.com",
  projectId: "zuzel-trenazery",
  storageBucket: "zuzel-trenazery.firebasestorage.app",
  messagingSenderId: "292949617155",
  appId: "1:292949617155:web:00cec5cac778acf6227c36"
};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'retro-zuzel-app';

        // Logika Gry i Stany
        const UI = {
            menu: document.getElementById('menu-screen'),
            lobby: document.getElementById('lobby-screen'),
            game: document.getElementById('game-screen'),
            playerNameInput: document.getElementById('player-name'),
            roomIdInput: document.getElementById('room-id'),
            createBtn: document.getElementById('btn-create-room'),
            joinBtn: document.getElementById('btn-join-room'),
            btBtn: document.getElementById('btn-connect-bt'),
            kbdBtn: document.getElementById('btn-use-keyboard'),
            btStatus: document.getElementById('bt-status'),
            lobbyRoomId: document.getElementById('lobby-room-id'),
            playersList: document.getElementById('players-list'),
            startRaceBtn: document.getElementById('btn-start-race'),
            hudPower: document.getElementById('hud-power'),
            hudLaps: document.getElementById('hud-laps'),
            hudPos: document.getElementById('hud-pos')
        };

        let app, auth, db;
        let currentUser = null;
        let currentRoomId = null;
        let unsubscribePlayers = null;
        let unsubscribeRoom = null;
        
        // Stan gracza
        let myPlayerId = null;
        let myName = "Żużlowiec_" + Math.floor(Math.random() * 1000);
        let myColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
        let myPower = 0; // w Watach
        let myDistance = 0;
        let myLaps = 0;
        let isUsingKeyboard = false;
        
        // Multiplayer stan
        let playersMap = new Map(); // id -> dane gracza
        let isRacing = false;
        const TOTAL_LAPS = 3;

        // --- Inicjalizacja Firebase ---
        async function initFirebase() {
            try {
                if(Object.keys(firebaseConfig).length === 0) {
                    console.warn("Brak konfiguracji Firebase. Tryb offline/błędów.");
                    return;
                }
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Autoryzacja
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        myPlayerId = user.uid;
                        UI.playerNameInput.value = myName;
                        console.log("Zalogowano:", user.uid);
                    }
                });
            } catch (e) {
                console.error("Błąd Firebase:", e);
                alert("Błąd połączenia z serwerem. Zobacz konsolę.");
            }
        }

        // --- Web Bluetooth API (Trenażer FTMS / Cycling Power) ---
        let bluetoothDevice = null;
        let powerCharacteristic = null;
        let lastBtPacketTime = 0;

        async function connectBluetooth() {
            try {
                UI.btStatus.innerText = "Szukam trenażera...";
                // Szukamy serwisu Cycling Power (0x1818)
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['cycling_power'] }]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
                
                UI.btStatus.innerText = "Łączenie...";
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService('cycling_power');
                powerCharacteristic = await service.getCharacteristic('cycling_power_measurement');
                
                await powerCharacteristic.startNotifications();
                powerCharacteristic.addEventListener('characteristicvaluechanged', handlePowerMeasurement);
                
                lastBtPacketTime = Date.now();
                
                UI.btStatus.innerText = "Podłączono! 🚲";
                UI.btStatus.classList.remove('text-red-500');
                UI.btStatus.classList.add('text-green-500');
                UI.btBtn.style.display = 'none';
                UI.kbdBtn.style.display = 'none';
            } catch (error) {
                // Środowisko iframe często blokuje Web Bluetooth ze względów bezpieczeństwa.
                // Usunięto console.error(), aby Canvas nie przechwytywał i nie wyświetlał okna błędu.
                
                // Obsługa błędu uprawnień w środowisku podglądu
                if (error.name === 'SecurityError' || (error.message && error.message.includes('permissions policy'))) {
                    UI.btStatus.innerText = "Brak uprawnień BT w tym podglądzie. Użyj klawiatury!";
                } else if (error.name === 'NotFoundError') {
                    UI.btStatus.innerText = "Nie wybrano urządzenia lub anulowano.";
                } else {
                    UI.btStatus.innerText = "Błąd połączenia: " + error.message;
                }
                
                UI.btStatus.classList.remove('text-green-500');
                UI.btStatus.classList.add('text-red-500');
            }
        }

        function onDisconnected() {
            UI.btStatus.innerText = "Utracono sygnał! Wznawianie...";
            UI.btStatus.classList.remove('text-green-500');
            UI.btStatus.classList.add('text-yellow-500');
            
            // Próba automatycznego wznowienia połączenia (Re-connect)
            setTimeout(reconnectBluetooth, 2000);
        }

        async function reconnectBluetooth() {
            if (!bluetoothDevice) return;
            try {
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService('cycling_power');
                powerCharacteristic = await service.getCharacteristic('cycling_power_measurement');
                await powerCharacteristic.startNotifications();
                
                UI.btStatus.innerText = "Podłączono ponownie! 🚲";
                UI.btStatus.classList.remove('text-yellow-500');
                UI.btStatus.classList.add('text-green-500');
                lastBtPacketTime = Date.now();
            } catch (e) {
                UI.btStatus.innerText = "Odłączono (błąd wznowienia).";
                UI.btStatus.classList.remove('text-yellow-500');
                UI.btStatus.classList.add('text-red-500');
                UI.btBtn.style.display = 'inline-block';
            }
        }

        function handlePowerMeasurement(event) {
            lastBtPacketTime = Date.now();
            const value = event.target.value;
            // Standard Cycling Power Measurement (0x2A63)
            // Flagi to pierwsze 2 bajty
            // Moc (Waty) to kolejne 2 bajty (sint16)
            let power = value.getInt16(2, true); 
            myPower = power;
            UI.hudPower.innerText = myPower + " W";
        }

        // Klawiatura Fallback
        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowUp' && isUsingKeyboard) {
                myPower = Math.min(myPower + 50, 600); // Max 600W
                UI.hudPower.innerText = myPower + " W";
            }
        });
        window.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowUp' && isUsingKeyboard) {
                // Spadek mocy jest płynny w logice gry
            }
        });


        // --- Logika Multiplayer ---

        function getRoomRef(roomId) {
            return doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
        }
        function getPlayersRef(roomId) {
            return collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId, 'players');
        }
        function getMyPlayerRef(roomId) {
            return doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId, 'players', myPlayerId);
        }

        async function createRoom() {
            if(!currentUser) return;
            const roomId = Math.random().toString(36).substring(2, 6).toUpperCase();
            myName = UI.playerNameInput.value || myName;
            
            await setDoc(getRoomRef(roomId), {
                status: 'waiting',
                createdAt: Date.now(),
                hostId: myPlayerId
            });

            await joinRoom(roomId);
        }

        async function joinRoom(roomId) {
            if(!currentUser || !roomId) return;
            myName = UI.playerNameInput.value || myName;
            roomId = roomId.toUpperCase();

            // Zapisz siebie do pokoju
            await setDoc(getMyPlayerRef(roomId), {
                name: myName,
                color: myColor,
                distance: 0,
                laps: 0,
                power: 0,
                finished: false
            });

            currentRoomId = roomId;
            showLobby();
            listenToRoom(roomId);
        }

        function listenToRoom(roomId) {
            // Nasłuchiwanie zmian w pokoju (np. start gry)
            unsubscribeRoom = onSnapshot(getRoomRef(roomId), (docSnapshot) => {
                if(docSnapshot.exists()) {
                    const data = docSnapshot.data();
                    if(data.status === 'racing' && !isRacing) {
                        startGameLoop();
                    }
                    if(data.hostId === myPlayerId) {
                        UI.startRaceBtn.style.display = 'inline-block';
                    }
                }
            }, (error) => console.error("Room listener error:", error));

            // Nasłuchiwanie graczy
            unsubscribePlayers = onSnapshot(getPlayersRef(roomId), (snapshot) => {
                playersMap.clear();
                UI.playersList.innerHTML = '';
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    playersMap.set(doc.id, data);
                    
                    const li = document.createElement('div');
                    li.className = 'mb-2 p-2 border-2 border-gray-600 bg-gray-800 flex justify-between items-center';
                    li.innerHTML = `
                        <span>
                            <span style="color:${data.color}">●</span> 
                            ${data.name} ${doc.id === myPlayerId ? '(Ty)' : ''}
                        </span>
                        <span class="text-xs text-gray-400">Laps: ${data.laps}/${TOTAL_LAPS}</span>
                    `;
                    UI.playersList.appendChild(li);
                });
            }, (error) => console.error("Players listener error:", error));
        }

        async function startRace() {
            if(currentRoomId) {
                await updateDoc(getRoomRef(currentRoomId), {
                    status: 'racing',
                    startTime: Date.now()
                });
            }
        }


        // --- Logika Gry (Fizyka i Rysowanie) ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        const TRACK_LENGTH = 1000; // umowna jednostka długości okrążenia
        let lastTime = 0;
        let dbUpdateTimer = 0;

        function showLobby() {
            UI.menu.classList.add('hidden');
            UI.lobby.classList.remove('hidden');
            UI.lobbyRoomId.innerText = currentRoomId;
        }

        function startGameLoop() {
            UI.lobby.classList.add('hidden');
            UI.game.classList.remove('hidden');
            isRacing = true;
            
            // Dopasuj canvas do kontenera
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function resizeCanvas() {
            const container = document.getElementById('game-screen');
            canvas.width = Math.min(container.clientWidth - 40, 800);
            canvas.height = canvas.width * 0.75; // 4:3 ratio
        }

        function getTrackPosition(distancePct, laneIndex, totalLanes) {
            // Tor to prostokąt z zaokrąglonymi bokami (stadion)
            const cw = canvas.width;
            const ch = canvas.height;
            
            // Środek i wymiary bazowe
            const cx = cw / 2;
            const cy = ch / 2;
            const straightLen = cw * 0.4; // długość prostej
            const baseRadius = ch * 0.3;  // promień wirażu
            
            // Odstępy pasów
            const laneWidth = (ch * 0.15) / Math.max(totalLanes, 1);
            const r = baseRadius + (laneIndex * laneWidth) - ((totalLanes * laneWidth)/2);
            
            // Punkty kontrolne
            const leftCenterX = cx - straightLen/2;
            const rightCenterX = cx + straightLen/2;
            
            // Obwód częściowy
            const curveLen = Math.PI * r;
            const totalLen = 2 * straightLen + 2 * curveLen;
            
            // Pozycja lokalna 0..totalLen, przesunięta o połowę prostej, 
            // aby wartość 0.0 (start/meta) idealnie pokrywała się z wizualną linią
            let d = ((distancePct % 1.0) * totalLen + straightLen/2) % totalLen;
            if (d < 0) d += totalLen; // zabezpieczenie
            
            let x, y, angle;

            if (d < straightLen) {
                // Dolna prosta (od lewej do prawej)
                x = leftCenterX + d;
                y = cy + r;
                angle = 0;
            } else if (d < straightLen + curveLen) {
                // Prawy wiraż (od dołu do góry)
                let arcD = d - straightLen;
                let a = Math.PI/2 - (arcD / curveLen) * Math.PI; // od 90 do -90 stopni
                x = rightCenterX + Math.cos(a) * r;
                y = cy + Math.sin(a) * r;
                angle = a - Math.PI/2;
            } else if (d < 2*straightLen + curveLen) {
                // Górna prosta (od prawej do lewej)
                let strD = d - (straightLen + curveLen);
                x = rightCenterX - strD;
                y = cy - r;
                angle = Math.PI;
            } else {
                // Lewy wiraż (od góry do dołu)
                let arcD = d - (2*straightLen + curveLen);
                let a = -Math.PI/2 - (arcD / curveLen) * Math.PI; // od -90 do -270 stopni
                x = leftCenterX + Math.cos(a) * r;
                y = cy + Math.sin(a) * r;
                angle = a - Math.PI/2;
            }

            return {x, y, angle};
        }

        function gameLoop(time) {
            if(!isRacing) return;
            
            const dt = (time - lastTime) / 1000; // sekundy
            lastTime = time;

            // 1. Fizyka lokalna (Tylko ja)
            // Utrata mocy, jeśli używamy klawiatury (symulacja oporu)
            if(isUsingKeyboard && myPower > 0) {
                myPower -= 80 * dt;
                if(myPower < 0) myPower = 0;
                UI.hudPower.innerText = Math.round(myPower) + " W";
            } else if (!isUsingKeyboard && bluetoothDevice && bluetoothDevice.gatt.connected) {
                // Trenażer Watchdog: jeśli pakiety BT utkną na >2.5s, zerujemy moc
                if (Date.now() - lastBtPacketTime > 2500 && myPower > 0) {
                    myPower = 0;
                    UI.hudPower.innerText = "0 W";
                }
            }

            // Prędkość na podstawie mocy (proste mapowanie: 300W = 1 okrążenie / 10s)
            // Prędkość w % okrążenia na sekundę
            let speed = (myPower / 300) * 0.1; 
            
            if(myLaps < TOTAL_LAPS) {
                myDistance += speed * dt;
                if(myDistance >= 1.0) {
                    myDistance -= 1.0;
                    myLaps++;
                    UI.hudLaps.innerText = myLaps + "/" + TOTAL_LAPS;
                    
                    if(myLaps >= TOTAL_LAPS) {
                        myDistance = 0; // Zatrzymaj na starcie
                        myPower = 0; // Odcięcie gazu po przekroczeniu mety
                        UI.hudPower.innerText = "0 W";
                        UI.hudPos.innerText = "META!";
                    }
                }
            }

            // 2. Synchronizacja z Firebase (Throttle do 10Hz by uniknąć limitów)
            dbUpdateTimer += dt;
            if(dbUpdateTimer > 0.1 && myLaps <= TOTAL_LAPS) {
                dbUpdateTimer = 0;
                // Asynchroniczny update - nie blokujemy rysowania
                updateDoc(getMyPlayerRef(currentRoomId), {
                    distance: myDistance,
                    laps: myLaps,
                    power: Math.round(myPower)
                }).catch(e => console.warn("DB Update skipped", e));
            }

            // 3. Rysowanie
            drawTrack();
            drawPlayers();

            requestAnimationFrame(gameLoop);
        }

        function drawTrack() {
            ctx.fillStyle = '#4a5d23'; // Trawa w środku
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width/2;
            const cy = canvas.height/2;
            const straightLen = canvas.width * 0.4;
            const baseRadius = canvas.height * 0.3;
            const trackWidth = canvas.height * 0.25;

            // Zewnętrzny obrys (banda)
            ctx.lineWidth = trackWidth;
            ctx.strokeStyle = '#3f2a14'; // Żużel
            ctx.lineCap = 'butt';

            ctx.beginPath();
            ctx.arc(cx - straightLen/2, cy, baseRadius, Math.PI/2, Math.PI*1.5);
            ctx.lineTo(cx + straightLen/2, cy - baseRadius);
            ctx.arc(cx + straightLen/2, cy, baseRadius, -Math.PI/2, Math.PI/2);
            ctx.lineTo(cx - straightLen/2, cy + baseRadius);
            ctx.stroke();

            // Wewnętrzna linia murawy
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#fff';
            ctx.beginPath();
            ctx.arc(cx - straightLen/2, cy, baseRadius - trackWidth/2, Math.PI/2, Math.PI*1.5);
            ctx.lineTo(cx + straightLen/2, cy - (baseRadius - trackWidth/2));
            ctx.arc(cx + straightLen/2, cy, baseRadius - trackWidth/2, -Math.PI/2, Math.PI/2);
            ctx.lineTo(cx - straightLen/2, cy + (baseRadius - trackWidth/2));
            ctx.stroke();

            // Linia Startu/Mety - Szachownica
            const startX = cx;
            const startY = cy + baseRadius - trackWidth/2;
            
            ctx.fillStyle = '#fff';
            ctx.fillRect(startX - 8, startY, 16, trackWidth);
            
            ctx.fillStyle = '#000';
            for (let i = 0; i < trackWidth; i += 8) {
                ctx.fillRect(startX - 8, startY + i, 8, 4);
                if (i + 4 < trackWidth) {
                    ctx.fillRect(startX, startY + i + 4, 8, 4);
                }
            }

        }

        function drawPlayers() {
            let index = 0;
            const totalPlayers = Math.max(playersMap.size, 1);
            
            // Sortowanie graczy wg progresu (Laps + distance)
            let sortedPlayers = Array.from(playersMap.values()).sort((a,b) => {
                let progA = a.laps + a.distance;
                let progB = b.laps + b.distance;
                return progB - progA;
            });

            // Aktualizacja HUD Pozycji (dla mnie)
            let myRank = sortedPlayers.findIndex(p => p.name === myName) + 1;
            if(myRank > 0 && myLaps < TOTAL_LAPS) UI.hudPos.innerText = "Poz: " + myRank;

            // Rysuj
            sortedPlayers.forEach((p, idx) => {
                // Zachowaj stały tor dla danego gracza bazując na indeksie by nie skakali
                // Można by hashować ID gracza, ale uprośćmy - tor losowy bazując na kolorze
                let laneSeed = parseInt(p.color.substring(1,3), 16) % totalPlayers;

                let pos = getTrackPosition(p.distance, laneSeed, totalPlayers);
                
                ctx.save();
                ctx.translate(pos.x, pos.y);
                ctx.rotate(pos.angle);

                // Motocykl (Prosty kwadracik)
                ctx.fillStyle = p.color;
                ctx.fillRect(-15, -8, 30, 16);
                
                // Koła
                ctx.fillStyle = '#000';
                ctx.fillRect(-12, -10, 8, 4);
                ctx.fillRect(-12, 6, 8, 4);
                ctx.fillRect(10, -10, 8, 4);
                ctx.fillRect(10, 6, 8, 4);

                // Nazwa gracza nad
                ctx.rotate(-pos.angle); // Zawsze poziomo
                ctx.fillStyle = '#fff';
                ctx.font = '10px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, 0, -15);
                
                // Info o końcu
                if(p.laps >= TOTAL_LAPS) {
                    ctx.fillStyle = '#ff0';
                    ctx.fillText("META", 0, 20);
                }

                ctx.restore();
            });

            // Ekran końca gry dla gracza
            if (myLaps >= TOTAL_LAPS) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '20px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText("WYŚCIG ZAKOŃCZONY", canvas.width/2, canvas.height/2);
                ctx.font = '10px "Press Start 2P"';
                ctx.fillStyle = '#f59e0b';
                ctx.fillText("Oczekuj na pozostałych zawodników...", canvas.width/2, canvas.height/2 + 30);
            }
        }

        // --- Event Listenery ---
        document.addEventListener('DOMContentLoaded', () => {
            initFirebase();

            UI.btBtn.addEventListener('click', connectBluetooth);
            
            UI.kbdBtn.addEventListener('click', () => {
                isUsingKeyboard = true;
                UI.btStatus.innerText = "Klawiatura aktywna! (GÓRA)";
                UI.btStatus.classList.add('text-yellow-400');
                UI.btBtn.style.display = 'none';
                UI.kbdBtn.style.display = 'none';
            });

            UI.createBtn.addEventListener('click', createRoom);
            
            UI.joinBtn.addEventListener('click', () => {
                const id = UI.roomIdInput.value.trim();
                if(id.length === 4) joinRoom(id);
                else alert("Podaj poprawny 4-znakowy kod.");
            });

            UI.startRaceBtn.addEventListener('click', startRace);
        });

    </script>
</head>
<body class="h-screen w-screen flex items-center justify-center scanlines relative">

    <!-- EKRAN GŁÓWNY (Menu) -->
    <div id="menu-screen" class="z-10 bg-black/80 p-8 border-4 border-gray-600 shadow-2xl max-w-md w-full text-center">
        <h1 class="text-3xl text-orange-500 mb-2" style="text-shadow: 4px 4px 0px #8b4513;">RETRO ŻUŻEL</h1>
        <p class="text-xs text-gray-400 mb-8">Edycja Trenażerowa (Multiplayer)</p>

        <div class="mb-6 text-left">
            <label class="block text-xs mb-2 text-gray-300">Nazwa zawodnika:</label>
            <input type="text" id="player-name" class="retro-input" placeholder="Wpisz nick...">
        </div>

        <div class="mb-6 p-4 border-2 border-dashed border-gray-600">
            <p class="text-xs mb-4">Sterowanie:</p>
            <button id="btn-connect-bt" class="retro-btn bg-blue-600 border-blue-400 w-full mb-2">Pojedź na trenażerze (BT)</button>
            <button id="btn-use-keyboard" class="retro-btn bg-gray-600 border-gray-400 w-full text-[0.6rem]">Testuj Klawiaturą (Strzałka w GÓRĘ)</button>
            <p id="bt-status" class="text-xs mt-2 text-gray-400">Oczekiwanie...</p>
        </div>

        <div class="space-y-4">
            <button id="btn-create-room" class="retro-btn w-full">Stwórz Pokój</button>
            
            <div class="flex space-x-2">
                <input type="text" id="room-id" class="retro-input w-2/3" placeholder="KOD..." maxlength="4">
                <button id="btn-join-room" class="retro-btn w-1/3 p-0">Dołącz</button>
            </div>
        </div>
    </div>

    <!-- EKRAN LOBBY -->
    <div id="lobby-screen" class="hidden z-10 bg-black/80 p-8 border-4 border-gray-600 shadow-2xl max-w-md w-full text-center">
        <h2 class="text-2xl text-orange-500 mb-4">PARK MASZYN</h2>
        <p class="mb-6">KOD POKOJU: <span id="lobby-room-id" class="text-green-400 text-xl font-bold tracking-widest"></span></p>
        
        <div class="text-left text-xs mb-4">Lista startowa:</div>
        <div id="players-list" class="mb-6 text-left text-sm h-48 overflow-y-auto">
            <!-- Lista generowana przez JS -->
        </div>

        <button id="btn-start-race" class="retro-btn bg-red-600 border-red-400 w-full hidden animate-pulse">START WYŚCIGU!</button>
        <p class="text-xs mt-4 text-gray-400">Oczekuj na start od hosta...</p>
    </div>

    <!-- EKRAN GRY -->
    <div id="game-screen" class="hidden absolute inset-0 flex flex-col z-0 p-4">
        
        <!-- HUD -->
        <div class="flex justify-between items-start mb-4 z-10 pointer-events-none">
            <div class="bg-black/70 p-4 border-2 border-gray-600">
                <div class="text-xs text-gray-400">MOC (W)</div>
                <div id="hud-power" class="text-2xl text-yellow-400">0 W</div>
            </div>
            <div class="bg-black/70 p-4 border-2 border-gray-600 text-center">
                <div class="text-xs text-gray-400">OKRĄŻENIA</div>
                <div id="hud-laps" class="text-2xl text-white">0/3</div>
            </div>
            <div class="bg-black/70 p-4 border-2 border-gray-600 text-right">
                <div class="text-xs text-gray-400">POZYCJA</div>
                <div id="hud-pos" class="text-2xl text-green-400">-</div>
            </div>
        </div>

        <!-- Obszar rysowania -->
        <div class="flex-grow flex items-center justify-center relative w-full h-full">
            <canvas id="game-canvas"></canvas>
        </div>
        
    </div>

</body>
</html>
